version: "3.9"

services:
  dts-panel:
    image: dts-panel/dts-panel:latest
    build:
      context: ../../.
      dockerfile: deploy/docker/Dockerfile.arm64
    container_name: dts-panel
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - dts_data:/home/dts/.dts-panel
      - dts_game:/home/dts/dst-server
    environment:
      - DST_PANEL_PORT=8080
      - DST_DATA_DIR=/home/dts/.dts-panel
      - DST_GAME_DIR=/home/dts/dst-server

volumes:
  dts_data:
  dts_game:
