<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Title}}</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body>
<nav class="navbar">
  <div class="nav-brand">🌲 DTS Panel</div>
  <div class="nav-links">
    <a href="/dashboard" class="{{pageActive .PageID "dashboard"}}">面板</a>
    <a href="/system" class="{{pageActive .PageID "system"}}">系统</a>
    <a href="/install" class="{{pageActive .PageID "install"}}">安装</a>
    <a href="/instances" class="{{pageActive .PageID "instances"}}">实例</a>
    <a href="/rooms" class="{{pageActive .PageID "rooms"}}">房间</a>
    <a href="/mods" class="{{pageActive .PageID "mods"}}">模组</a>
  </div>
</nav>
<main class="container">
  <h1>系统环境</h1>

  <section class="card-grid">
    <div class="info-card">
      <h3>⚙️ 服务器</h3>
      <p class="big-value" id="sys-arch">加载中...</p>
      <p class="dim" id="sys-cpu">加载中...</p>
    </div>
    <div class="info-card">
      <h3>🎮 DST 状态</h3>
      <p id="game-status" class="big-value">加载中...</p>
    </div>
    <div class="info-card">
      <h3>📦 SteamCMD</h3>
      <p id="steamcmd-status" class="big-value">加载中...</p>
    </div>
  </section>

  <div class="table-container">
    <table class="data-table" id="sys-table">
      <thead><tr><th>项目</th><th>值</th></tr></thead>
      <tbody><tr><td colspan="2">加载中...</td></tr></tbody>
    </table>
  </div>

  <div class="notice-box">
    <p>📋 Oracle ARM (aarch64) 部署须知</p>
    <ul>
      <li>Go 二进制为 <code>linux/arm64</code> 编译，直接运行</li>
      <li>SteamCMD 官方 Linux 版本在 ARM64 上兼容</li>
      <li>需要 <code>libc6</code>、<code>libstdc++6</code>、<code>libglib2.0-0</code> 等依赖</li>
    </ul>
  </div>
</main>
<script>
(async () => {
  try {
    const d = (await (await fetch('/api/system/status')).json()).data;
    document.getElementById('sys-arch').textContent = d.arch + (d.is_arm64 ? ' (ARM64 ✓)' : '');
    document.getElementById('sys-cpu').textContent = 'CPU: ' + (d.cpu || 'Unknown') + ' | Cores: ' + d.cpu_count;
    document.getElementById('game-status').textContent = d.game ? '✓ 已安装' : '✗ 未安装';
    document.getElementById('game-status').style.color = d.game ? 'var(--accent)' : 'var(--danger)';
    document.getElementById('steamcmd-status').textContent = d.steamcmd ? '✓ 已安装' : '✗ 未安装';
    document.getElementById('steamcmd-status').style.color = d.steamcmd ? 'var(--accent)' : 'var(--danger)';
    document.querySelector('#sys-table tbody').innerHTML = `
      <tr><td>操作系统</td><td>${d.os}</td></tr>
      <tr><td>架构</td><td>${d.arch}</td></tr>
      <tr><td>CPU</td><td>${d.cpu}</td></tr>
      <tr><td>核心数</td><td>${d.cpu_count}</td></tr>
      <tr><td>数据目录</td><td>${d.data_dir}</td></tr>
      <tr><td>游戏目录</td><td>${d.game_dir}</td></tr>
    `;
  } catch (e) {
    document.getElementById('sys-arch').textContent = '加载失败: ' + e.message;
  }
})();
</script>
</body></html>
