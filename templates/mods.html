<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Title}}</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body>
<nav class="navbar">
  <div class="nav-brand">🌲 DTS Panel</div>
  <div class="nav-links">
    <a href="/dashboard" class="{{pageActive .PageID "dashboard"}}">面板</a>
    <a href="/system" class="{{pageActive .PageID "system"}}">系统</a>
    <a href="/install" class="{{pageActive .PageID "install"}}">安装</a>
    <a href="/clusters" class="{{pageActive .PageID "clusters"}}">房间</a>
    <a href="/mods" class="{{pageActive .PageID "mods"}}">模组</a>
  </div>
</nav>
<main class="container">
  {{if .FlashMsg}}<div class="flash-msg">{{.FlashMsg}}</div>{{end}}

  <div class="page-header">
    <h1>模组管理</h1>
  </div>

  <div class="form-card">
    <h3>添加模组</h3>
    <form method="POST" action="/mods/action">
      <input type="hidden" name="action" value="add">
      <div class="form-row">
        <input type="text" name="mod_id" placeholder="Steam Workshop ID *" required>
        <input type="text" name="mod_name" placeholder="模组名称 *" required>
        <input type="text" name="mod_url" placeholder="Workshop URL (可选)">
        <button class="btn btn-primary" type="submit">添加</button>
      </div>
    </form>
  </div>

  <div class="table-container">
    <table class="data-table">
      <thead><tr><th>ID</th><th>名称</th><th>状态</th><th>操作</th></tr></thead>
      <tbody>
      {{if .Mods}}
        {{range .Mods}}
        <tr>
          <td><code>{{.ModID}}</code></td>
          <td>{{.ModName}}</td>
          <td><span class="badge {{if .Enabled}}badge-running{{else}}badge-stopped{{end}}">
            {{if .Enabled}}启用{{else}}禁用{{end}}
          </span></td>
          <td>
            {{if .Enabled}}
            <form method="POST" action="/mods/action" style="display:inline">
              <input type="hidden" name="action" value="disable">
              <input type="hidden" name="mod_id" value="{{.ModID}}">
              <button class="btn btn-sm" type="submit">禁用</button>
            </form>
            {{else}}
            <form method="POST" action="/mods/action" style="display:inline">
              <input type="hidden" name="action" value="enable">
              <input type="hidden" name="mod_id" value="{{.ModID}}">
              <button class="btn btn-sm" type="submit">启用</button>
            </form>
            {{end}}
            <form method="POST" action="/mods/action" style="display:inline">
              <input type="hidden" name="action" value="delete">
              <input type="hidden" name="mod_id" value="{{.ModID}}">
              <button class="btn btn-sm btn-danger" type="submit" onclick="return confirm('确认删除？')">删除</button>
            </form>
            <form method="POST" action="/mods/action" style="display:inline">
              <input type="hidden" name="action" value="download">
              <input type="hidden" name="mod_id" value="{{.ModID}}">
              <button class="btn btn-sm" type="submit">下载</button>
            </form>
          </td>
        </tr>
        {{end}}
      {{else}}
        <tr><td colspan="4" class="empty-msg">暂无模组</td></tr>
      {{end}}
      </tbody>
    </table>
  </div>
</main>
</body></html>
