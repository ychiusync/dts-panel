<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Title}}</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body>
<nav class="navbar">
  <div class="nav-brand">🌲 DTS Panel</div>
  <div class="nav-links">
    <a href="/dashboard" class="{{pageActive .PageID "dashboard"}}">面板</a>
    <a href="/system" class="{{pageActive .PageID "system"}}">系统</a>
    <a href="/install" class="{{pageActive .PageID "install"}}">安装</a>
    <a href="/instances" class="{{pageActive .PageID "instances"}}">实例</a>
    <a href="/rooms" class="{{pageActive .PageID "rooms"}}">房间</a>
    <a href="/mods" class="{{pageActive .PageID "mods"}}">模组</a>
  </div>
</nav>
<main class="container">
  {{if .FlashMsg}}<div class="flash-msg">{{.FlashMsg}}</div>{{end}}

  <div class="page-header">
    <h1>实例管理</h1>
    <form method="POST" action="/instances/create" class="inline">
      <input type="text" name="name" placeholder="实例名称" required
             style="padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2);color:var(--text);font-size:0.9rem">
      <input type="hidden" name="master_port" value="10999">
      <input type="hidden" name="cluster_port" value="11000">
      <input type="hidden" name="max_players" value="10">
      <button class="btn btn-primary" type="submit">+ 创建</button>
    </form>
  </div>

  <div class="table-container">
    <table class="data-table">
      <thead><tr><th>名称</th><th>状态</th><th>端口</th><th>最大玩家</th><th>操作</th></tr></thead>
      <tbody>
      {{if .Instances}}
        {{range .Instances}}
        <tr>
          <td><strong>{{.Name}}</strong></td>
          <td><span class="badge badge-{{statusClass .Status}}">{{.Status}}</span></td>
          <td>{{.MasterPort}} / {{.ClusterPort}}</td>
          <td>{{.MaxPlayers}}</td>
          <td>
            <form method="POST" action="/instances/action" style="display:inline">
              <input type="hidden" name="id" value="{{.ID}}">
              <input type="hidden" name="action" value="start">
              <button class="btn btn-sm" type="submit">启动</button>
            </form>
            <form method="POST" action="/instances/action" style="display:inline">
              <input type="hidden" name="id" value="{{.ID}}">
              <input type="hidden" name="action" value="stop">
              <button class="btn btn-sm" type="submit">停止</button>
            </form>
            <form method="POST" action="/instances/action" style="display:inline">
              <input type="hidden" name="id" value="{{.ID}}">
              <input type="hidden" name="action" value="restart">
              <button class="btn btn-sm" type="submit">重启</button>
            </form>
            <form method="POST" action="/instances/action" style="display:inline">
              <input type="hidden" name="id" value="{{.ID}}">
              <input type="hidden" name="action" value="delete">
              <button class="btn btn-sm btn-danger" type="submit" onclick="return confirm('确认删除 {{.Name}}？')">删除</button>
            </form>
          </td>
        </tr>
        {{end}}
      {{else}}
        <tr><td colspan="5" class="empty-msg">暂无实例，填写名称后点击「创建」</td></tr>
      {{end}}
      </tbody>
    </table>
  </div>
</main>
</body></html>
